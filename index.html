<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasida New Website</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
      <header class="top-header">
      <div class="container top-header__inner">
        <div class="top-header__nav">
          <div class="top-header__item" data-scroll-target="site-footer__title">צרו קשר</div>
          <a class="top-header__item" href="public/pdfs/hasida-zohar-resume.pdf" target="_blank" rel="noopener">קורות חיים</a>
          <div class="top-header__item" data-scroll-target="about-section__text">קצת עלי</div>
          <div class="top-header__item" data-scroll-target="feature-row__text">פרויקטים</div>
        </div>
        <img class="logo" src="public/images/top/logo.png" alt="Hasida logo">
      </div>
    </header>
    <div class="page-shell">
      <header class="site-header">
        <div class="container site-header__container">
          <img class="header-asset header-asset--1" src="public/images/header/1.svg" alt="Decorative shape">
          <img class="header-asset header-asset--title" src="public/images/header/title-hero.png" alt="Title graphic">
          <img class="header-asset header-asset--button" src="public/images/header/button.png" alt="Button graphic">
          <img class="header-asset header-asset--feather" src="public/images/header/feather.png" alt="Feather decoration">
        </div>
      </header>

      <main class="container">
        <section id="about" class="about-section">
          <div class="about-section__around2">
            <img class="about-section__around2-image" src="public/images/about-me/around2.png" alt="Around 2">
            <img class="about-section__text" src="public/images/about-me/text.svg" alt="Text">
          </div>
          <img class="about-section__around" src="public/images/about-me/around.png" alt="Around">
          <img class="about-section__hasida" src="public/images/about-me/hasida.png" alt="Hasida">
          <img class="about-section__middle" src="public/images/about-me/middle.png" alt="Middle">
        </section>

        <section class="process-section">
          <div class="process-section__overlay"></div>
          <div class="process-section__content">
            <img class="process-section__text" src="public/images/process/text.svg" alt="Text">
            <img class="process-section__below" src="public/images/process/below-process.png" alt="Below process">
            <img class="process-section__process" src="public/images/process/process.svg" alt="Process">
          </div>
        </section>

        <section id="branding-projects" class="feature-row-section">
          <img class="feature-row__text" src="public/images/branding-projects/text.svg" alt="Text">
          <img class="feature-row__line" src="public/images/branding-projects/line.svg" alt="Line">
          <a href="public/pdfs/smartkids.pdf" target="_blank" rel="noopener">    
          <img class="feature-row__item feature-row__item--smartkids" src="public/images/branding-projects/smartkids.svg" alt="Smartkids">
         </a>
          <a href="public/pdfs/la-maline.pdf" target="_blank" rel="noopener">
            <img class="feature-row__item feature-row__item--la-maline" src="public/images/branding-projects/la-maline.svg" alt="La Maline">
          </a>
          <a href="public/pdfs/music.pdf" target="_blank" rel="noopener">
            <img class="feature-row__item feature-row__item--music" src="public/images/branding-projects/music.svg" alt="Music">
          </a>
          <a href="public/pdfs/winera.pdf" target="_blank" rel="noopener">
            <img class="feature-row__item feature-row__item--winera" src="public/images/branding-projects/winera.svg" alt="Winera">
          </a>
        </section>

        <section class="design-section">
          <img class="design-section__text" src="public/images/design/text.svg" alt="Text">
          <img class="design-section__line" src="public/images/design/line.svg" alt="Line">

          <div class="design-section__box design-section__box--one">
            <div class="design-section__overlay design-section__overlay--right"></div>
            <a href="https://hasida-website.vercel.app/" target="_blank" rel="noopener">
              <img class="design-section__mock design-section__mock--one" src="public/images/design/mock1.png" alt="Mock 1">
            </a>
          </div>

          <img class="design-section__text2" src="public/images/design/text2.svg" alt="Text 2">
          <img class="design-section__feather design-section__feather--one" src="public/images/design/feather.svg" alt="Feather">

          <div class="design-section__box design-section__box--two">
            <div class="design-section__overlay design-section__overlay--left"></div>
            <a href="https://cheers-website-alpha.vercel.app/" target="_blank" rel="noopener">
              <img class="design-section__mock design-section__mock--two" src="public/images/design/mock2.png" alt="Mock 2">
            </a>
          </div>

          <img class="design-section__text3" src="public/images/design/text3.svg" alt="Text 3">
          <img class="design-section__feather design-section__feather--two" src="public/images/design/feather.svg" alt="Feather">
        </section>

      </main>

      <footer class="site-footer">
        <img class="site-footer__title" src="public/images/footer/title.svg" alt="Footer title">
        <img class="site-footer__line" src="public/images/footer/line.svg" alt="Footer line">
        <img class="site-footer__invited" src="public/images/footer/invited.svg" alt="Invited">

        <div class="site-footer__socials">
          <a href="tel:+972527475755"><img class="social social--whatsapp" src="public/images/footer/whatsapp.svg" alt="WhatsApp"></a>
          <a href="https://www.linkedin.com/in/hasida-zohar/" target="_blank" rel="noopener"><img class="social social--linkedin" src="public/images/footer/linkedin.svg" alt="LinkedIn"></a>
          <a href="https://www.instagram.com/hasida_zohar/" target="_blank" rel="noopener"><img class="social social--instagram" src="public/images/footer/instagram.svg" alt="Instagram"></a>
        </div>

        <img class="site-footer__right" src="public/images/footer/rights.svg" alt="Right">
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
